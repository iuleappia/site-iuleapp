<!DOCTYPE html>
<html lang="pt-br">
<head>

  <!-- Google tag (gtag.js) -->
<script src="analytics.js"></script>
  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App Informática</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f1f3f5;
  height:100vh;
  overflow:hidden;
}

/* TOPO */

.topo{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:55px;
  background:#0d6efd;
  color:white;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:15px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 2px 5px rgba(0,0,0,0.2);
  z-index:1000;
}

/* CONTEÚDO */

#app{
  position:absolute;
  top:55px;
  bottom:65px;
  left:0;
  right:0;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* MENU */

.menu{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -3px 10px rgba(0,0,0,0.15);
  z-index:999;
}

/* BOTÕES */

.menu button{
  background:none;
  border:none;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
  padding:6px 10px;
  border-radius:10px;
  transition:0.2s;
  position:relative;
}

/* ÍCONE */

.menu span{
  font-size:22px;
  margin-bottom:3px;
}

/* CLIQUE */

.menu button:active{
  transform:scale(0.9);
}

/* BOTÃO ATIVO */

.menu button.ativo{
  color:#0d6efd;
  font-weight:bold;
}

/* LINHA DO BOTÃO ATIVO */

.menu button.ativo::before{
  content:"";
  position:absolute;
  width:40px;
  height:4px;
  background:#0d6efd;
  bottom:0;
  border-radius:10px;
}

/* RESPONSIVO */

@media(min-width:700px){

  .menu{
    height:70px;
  }

  .menu span{
    font-size:24px;
  }

  .menu button{
    font-size:13px;
  }

  .topo{
    font-size:20px;
  }

}

</style>

</head>

<body>

<!-- TOPO -->
<div class="topo" id="tituloPagina">
Informática
</div>

<!-- APP -->
<div id="app">
  <iframe id="frame" src="home.html"></iframe>
</div>

<!-- MENU -->
<div class="menu">

  <button class="ativo" onclick="abrirPagina('home.html',this)">
    <span>🏠</span>
    Home
  </button>

  <button onclick="abrirPagina('disciplinas.html',this)">
    <span>📚</span>
    Disciplinas
  </button>

  <button onclick="abrirPagina('simulados.html',this)">
    <span>📝</span>
    Simulados
  </button>

  <button onclick="abrirPagina('excel.html',this)">
    <span>📊</span>
    Excel
  </button>

  <button onclick="abrirPagina('cursos.html',this)">
    <span>🌐</span>
    Cursos
  </button>

</div>

<script>

/* DOMÍNIOS EXTERNOS */

let externos = [
  "hotmart.com",
  "pay.hotmart.com",
  "payment.hotmart.com",
  "wa.me",
  "whatsapp.com",
  "instagram.com",
  "youtube.com"
];

/* FUNÇÃO PRINCIPAL */

function abrirPagina(url, botao){

  let externo = externos.some(d => url.includes(d));

  if(externo){
    window.open(url,"_blank");
  } else {
    document.getElementById("frame").src = url;
  }

  /* BOTÃO ATIVO */

  document.querySelectorAll(".menu button")
  .forEach(b => b.classList.remove("ativo"));

  botao.classList.add("ativo");

  /* PEGAR TEXTO DO BOTÃO */

  let clone = botao.cloneNode(true);
  let span = clone.querySelector("span");

  if(span) span.remove();

  let titulo = clone.innerText.trim();

  document.getElementById("tituloPagina").innerText = titulo;

}

</script>

</body>
</html>
